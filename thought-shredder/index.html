<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>深夜避難所 | 發洩塔羅處方箋</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #0c0d12;
      color: #e2e8f0;
      touch-action: manipulation;
    }
    textarea:focus { outline: none; }
    .fade-in { animation: fadeIn 0.6s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* 3D 翻牌動效 */
    .card-container {
      perspective: 1000px;
    }
    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      transform-style: preserve-3d;
    }
    .card-inner.flipped {
      transform: rotateY(180deg);
    }
    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 0.75rem;
    }
    .card-back {
      transform: rotateY(180deg);
    }
  </style>
  <link rel="manifest" href="manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body class="h-screen w-screen flex flex-col items-center justify-between p-5 select-none overflow-hidden font-sans">

  <!-- 頂部金句 -->
  <header class="w-full max-w-md pt-4 text-center z-10">
    <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-neutral-900 border border-neutral-800 text-[11px] text-rose-400/90 mb-2">
      <span>✦</span><span>黑化發洩 × 塔羅真理處方</span><span>✦</span>
    </div>
    <div class="bg-neutral-900/40 border border-neutral-800/60 rounded-xl p-3 backdrop-blur-sm">
      <p id="dailyQuoteText" class="text-xs text-neutral-400 font-light leading-relaxed"></p>
    </div>
  </header>

  <main class="w-full max-w-md flex-1 flex flex-col items-center justify-center relative my-2">
    <canvas id="particleCanvas" class="absolute inset-0 pointer-events-none z-30"></canvas>

    <!-- 步驟 1：輸入心事區塊 -->
    <div id="stepInput" class="w-full bg-[#161822] border border-neutral-800/90 rounded-2xl p-5 shadow-2xl transition-all duration-500 z-10">
      <div class="flex items-center justify-between mb-2">
        <span class="text-xs text-neutral-400 font-medium">傾訴心事與黑化怒氣</span>
        <span class="text-[11px] text-rose-400/80">心事傾倒槽</span>
      </div>
      <textarea id="thoughtInput" rows="4" placeholder="今天遇到什麼爛事？主管發瘋、同事甩鍋、破事一堆...寫下來，準備選一張咒語牌狠狠發洩！" class="w-full bg-transparent text-sm text-neutral-200 placeholder-neutral-600 resize-none font-light leading-relaxed"></textarea>
      
      <div class="flex justify-between items-center mt-3 pt-3 border-t border-neutral-800/50">
        <span class="text-[11px] text-neutral-500">寫完即焚 · 不留痕跡</span>
        <button onclick="goToPickStep()" class="px-5 py-2.5 bg-gradient-to-r from-rose-500/90 to-red-600/90 hover:from-rose-500 hover:to-red-600 active:scale-95 text-xs text-white font-semibold rounded-xl transition-all shadow-lg flex items-center gap-1.5">
          <span>召喚發洩牌卡</span><span>🧨</span>
        </button>
      </div>
    </div>

    <!-- 步驟 2：發洩抽牌區塊（背面可愛發洩圖，點擊翻開為正面塔羅牌） -->
    <div id="stepPick" class="hidden opacity-0 w-full transition-all duration-500 z-10 text-center">
      <h3 class="text-sm font-medium text-rose-300/90 mb-1">想怎麼對付他們？直覺選一張！</h3>
      <p class="text-[11px] text-neutral-500 mb-4">點擊發洩符咒，翻開屬於妳的正統塔羅真理</p>
      
      <div class="grid grid-cols-3 gap-2.5 w-full px-1" id="cardsGrid"></div>
      
      <div id="loadingText" class="hidden text-xs text-amber-400/90 mt-5 animate-pulse">
        ✦ 塔羅牌已顯現，AI 正在為妳結合心事調配處方箋...
      </div>
    </div>

    <!-- 步驟 3：處方箋拍立得卡片 -->
    <div id="prescriptionCard" class="opacity-0 pointer-events-none absolute w-full transition-all duration-700 z-20">
      <div class="w-full bg-gradient-to-b from-[#1c1e2b] to-[#12131c] border border-neutral-700/60 rounded-2xl p-5 shadow-2xl relative overflow-hidden">
        
        <div class="flex justify-between items-center border-b border-neutral-800/70 pb-2 mb-3">
          <span class="text-[11px] tracking-wider text-amber-400 font-medium">✦ 翻開塔羅 · 宇宙指引</span>
          <span id="cardName" class="text-xs font-semibold text-amber-200 bg-amber-950/60 px-2.5 py-0.5 rounded-full border border-amber-800/50"></span>
        </div>

        <div class="my-3 p-3 rounded-xl bg-amber-950/20 border border-amber-900/30 text-center">
          <p id="cardEncouragement" class="text-xs text-amber-200/90 font-normal leading-relaxed"></p>
        </div>

        <div class="mb-3">
          <div class="text-[11px] text-neutral-400 mb-1 font-medium">【 塔羅牌意與心靈洞察 】</div>
          <p id="cardInsight" class="text-xs text-neutral-300 font-light leading-relaxed"></p>
        </div>

        <div class="grid grid-cols-1 gap-2 text-xs pt-2 border-t border-neutral-800/60">
          <div class="flex items-start gap-2">
            <span class="text-emerald-400 font-medium whitespace-nowrap">🌿 今日宜：</span>
            <span id="luckyAction" class="text-neutral-300 font-light"></span>
          </div>
          <div class="flex items-start gap-2">
            <span class="text-rose-400 font-medium whitespace-nowrap">⚠️ 今日忌：</span>
            <span id="avoidAction" class="text-neutral-300 font-light"></span>
          </div>
          <div class="flex items-start gap-2">
            <span class="text-indigo-300 font-medium whitespace-nowrap">🎨 幸運色與開運：</span>
            <span id="luckyOutfit" class="text-neutral-300 font-light"></span>
          </div>
        </div>

        <div class="flex gap-2 mt-4 pt-3 border-t border-neutral-800/60">
          <button onclick="shredAndFinish()" class="flex-1 py-2.5 bg-neutral-800/90 hover:bg-neutral-700 active:scale-95 text-xs text-neutral-300 font-medium rounded-xl transition flex items-center justify-center gap-1">
            <span>把破事徹底粉碎</span><span>⚡</span>
          </button>
          <button onclick="resetView()" class="px-4 py-2.5 border border-neutral-800 hover:border-neutral-700 text-xs text-neutral-400 rounded-xl transition">
            重抽一次
          </button>
        </div>
      </div>
    </div>

    <!-- 步驟 4：粉碎完成畫面 -->
    <div id="peaceCard" class="opacity-0 pointer-events-none absolute transition-opacity duration-1000 text-center z-10">
      <div class="w-12 h-12 mx-auto mb-4 rounded-full bg-emerald-950/40 border border-emerald-800/30 flex items-center justify-center text-emerald-400 text-lg">✓</div>
      <h2 class="text-base font-normal text-neutral-200">心事與壞運已粉碎</h2>
      <p class="text-xs text-neutral-400 mt-2 leading-relaxed max-w-xs mx-auto">氣也出夠了，塔羅指引也拿到了。<br>今天就到這裡，好好善待自己！</p>
      <button onclick="resetView()" class="mt-6 px-5 py-2 border border-neutral-800 rounded-full text-xs text-neutral-400 hover:text-neutral-200 hover:border-neutral-700 transition">還有煩惱想倒掉</button>
    </div>
  </main>

  <footer class="w-full max-w-md pb-4 text-center z-10">
    <p class="text-[11px] text-neutral-500 tracking-wider">深呼吸 · 順應指引 · 睡個好覺</p>
  </footer>

  <script>
    // 22 張經典大阿爾克那塔羅牌
    const tarotDeck = [
      { name: "愚者 (The Fool)", icon: "🎒", keyword: "重新歸零 · 信任直覺" },
      { name: "魔術師 (The Magician)", icon: "🪄", keyword: "主動創造 · 掌控局面" },
      { name: "女祭司 (The High Priestess)", icon: "📜", keyword: "向內沉潛 · 直覺敏銳" },
      { name: "皇后 (The Empress)", icon: "👑", keyword: "滋養自我 · 享受豐盛" },
      { name: "皇帝 (The Emperor)", icon: "🏛️", keyword: "重整秩序 · 確立邊界" },
      { name: "教皇 (The Hierophant)", icon: "🕊️", keyword: "心靈智慧 · 尋求共鳴" },
      { name: "戀人 (The Lovers)", icon: "💞", keyword: "忠於本心 · 和諧抉擇" },
      { name: "戰車 (The Chariot)", icon: "⚔️", keyword: "意志堅定 · 衝破迷霧" },
      { name: "力量 (Strength)", icon: "🦁", keyword: "溫柔堅定 · 以柔克剛" },
      { name: "隱士 (The Hermit)", icon: "🏮", keyword: "安靜留白 · 獨立思考" },
      { name: "命運之輪 (Wheel of Fortune)", icon: "☸️", keyword: "轉機來臨 · 順應循環" },
      { name: "正義 (Justice)", icon: "⚖️", keyword: "理智客觀 · 心中坦然" },
      { name: "倒吊人 (The Hanged Man)", icon: "🌱", keyword: "換個視角 · 換位沈澱" },
      { name: "死神 (Death)", icon: "🥀", keyword: "果斷告別 · 迎接新生" },
      { name: "節制 (Temperance)", icon: "🏺", keyword: "平衡情緒 · 慢調生活" },
      { name: "惡魔 (The Devil)", icon: "⛓️", keyword: "斬斷內耗 · 奪回自主" },
      { name: "高塔 (The Tower)", icon: "⚡", keyword: "打破枷鎖 · 釋放包袱" },
      { name: "星星 (The Star)", icon: "⭐", keyword: "希望重燃 · 深層治癒" },
      { name: "月亮 (The Moon)", icon: "🌙", keyword: "看破虛妄 · 接納不安" },
      { name: "太陽 (The Sun)", icon: "☀️", keyword: "萬物晴朗 · 充滿朝氣" },
      { name: "審判 (Judgement)", icon: "🎺", keyword: "自我和解 · 重新復甦" },
      { name: "世界 (The World)", icon: "🌍", keyword: "圓滿休止 · 怡然自得" }
    ];

    // 背面可愛發洩咒語池
    const ventOptions = [
      { text: "茶杯放毒", icon: "🍵💀", sub: "偷偷加一滴" },
      { text: "飛踢後腦", icon: "🦵💥", sub: "直接踹飛" },
      { text: "狠狠揍他", icon: "🥊🔥", sub: "賞兩拳消氣" },
      { text: "鍵盤拔光", icon: "⌨️😈", sub: "拔掉他空白鍵" },
      { text: "畫符咒他", icon: "📜👻", sub: "讓他踩到樂高" },
      { text: "輪胎洩氣", icon: "🛞🪡", sub: "讓他慢慢推車" },
      { text: "咖啡倒翻", icon: "☕🫠", sub: "弄髒他新衣服" }
    ];

    let currentCandidateCards = [];

    const quotes = [
      "「 上班只是演一齣領薪水的戲，今天不要拿別人的情緒來懲罰自己。」",
      "「 今天做不完的事，代表今天根本不該做完。妳已經撐了一整天，被窩現在完全屬於妳。」",
      "「 不用對每個人的期待負責，妳的首要任務是先照顧好自己。」",
      "「 剛剛那個尷尬或委屈的瞬間，其實除了妳之外沒人會一直記得。放過自己吧。」",
      "「 宇宙把妳放在這個位置，不是要妳事事完美，而是要妳學會心疼自己。」"
    ];

    function loadDailyQuote() {
      const today = new Date();
      const dayOfYear = Math.floor((today - new Date(today.getFullYear(), 0, 0)) / 1000 / 60 / 60 / 24);
      document.getElementById('dailyQuoteText').innerText = quotes[dayOfYear % quotes.length];
    }
    loadDailyQuote();

    let audioCtx = null;
    function playSingingBowl() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(432, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(108, audioCtx.currentTime + 3.5);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3.5);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 3.5);
      } catch (e) { }
    }

    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function createParticles(x, y) {
      for (let i = 0; i < 140; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 6 + 2;
        particles.push({
          x: x, y: y,
          vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed - 2,
          size: Math.random() * 2.5 + 1, alpha: 1, decay: Math.random() * 0.02 + 0.015,
          color: Math.random() > 0.4 ? '#f59e0b' : '#e2e8f0'
        });
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.1; p.alpha -= p.decay;
        ctx.save(); ctx.globalAlpha = Math.max(0, p.alpha); ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size); ctx.restore();
        if (p.alpha <= 0) particles.splice(i, 1);
      }
      if (particles.length > 0) requestAnimationFrame(animateParticles);
    }

    function goToPickStep() {
      const thoughtInput = document.getElementById('thoughtInput');
      if (!thoughtInput.value.trim()) {
        thoughtInput.focus();
        return;
      }

      const shuffledCards = [...tarotDeck].sort(() => 0.5 - Math.random());
      currentCandidateCards = shuffledCards.slice(0, 3);
      const shuffledVents = [...ventOptions].sort(() => 0.5 - Math.random());

      const cardsGrid = document.getElementById('cardsGrid');
      cardsGrid.innerHTML = '';

      for (let i = 0; i < 3; i++) {
        const vent = shuffledVents[i];
        const card = currentCandidateCards[i];

        const cardContainer = document.createElement('div');
        cardContainer.className = "card-container h-52 cursor-pointer";
        cardContainer.id = `card-box-${i}`;
        cardContainer.onclick = () => selectCard(i);

        cardContainer.innerHTML = `
          <div class="card-inner shadow-xl" id="card-inner-${i}">
            <!-- 卡片背面：可愛發洩符咒 -->
            <div class="card-front bg-gradient-to-b from-[#25151b] to-[#141217] border border-rose-500/50 p-2.5 flex flex-col items-center justify-center">
              <span class="text-3xl mb-1 filter drop-shadow">${vent.icon}</span>
              <span class="text-xs text-rose-300 font-bold tracking-wider mb-1">${vent.text}</span>
              <span class="text-[9px] text-neutral-400 font-light bg-black/50 px-2 py-0.5 rounded-full border border-neutral-800">${vent.sub}</span>
              <div class="mt-3 text-[10px] text-rose-400/90 font-medium animate-pulse">點擊翻牌 ⚡</div>
            </div>

            <!-- 卡片正面：塔羅牌真實卡面 -->
            <div class="card-back bg-gradient-to-b from-[#242116] to-[#14130e] border-2 border-amber-400/70 p-2.5 flex flex-col items-center justify-between shadow-[0_0_15px_rgba(245,158,11,0.25)]">
              <span class="text-[10px] text-amber-400/80 tracking-widest uppercase">TAROT</span>
              <div class="my-auto text-center">
                <div class="text-3xl mb-1">${card.icon}</div>
                <div class="text-xs text-amber-200 font-semibold">${card.name}</div>
                <div class="text-[9px] text-amber-400/70 mt-1">${card.keyword}</div>
              </div>
              <span class="text-[9px] text-amber-500/80">✦ 命運已揭曉 ✦</span>
            </div>
          </div>
        `;
        cardsGrid.appendChild(cardContainer);
      }

      const stepInput = document.getElementById('stepInput');
      const stepPick = document.getElementById('stepPick');

      stepInput.style.transform = 'scale(0.95)';
      stepInput.style.opacity = '0';
      
      setTimeout(() => {
        stepInput.classList.add('hidden');
        stepPick.classList.remove('hidden');
        requestAnimationFrame(() => {
          stepPick.classList.remove('opacity-0');
          stepPick.classList.add('opacity-100');
        });
      }, 300);
    }

    async function selectCard(index) {
      if (navigator.vibrate) navigator.vibrate([40, 60]);

      const selectedCard = currentCandidateCards[index];
      const thought = document.getElementById('thoughtInput').value.trim();
      const loadingText = document.getElementById('loadingText');
      const cardsGrid = document.getElementById('cardsGrid');

      // 鎖定點擊並觸發選中卡片的 3D 翻轉
      cardsGrid.style.pointerEvents = 'none';
      const innerCard = document.getElementById(`card-inner-${index}`);
      innerCard.classList.add('flipped');

      // 將其他未選中的卡片淡化
      for (let i = 0; i < 3; i++) {
        if (i !== index) {
          const otherCard = document.getElementById(`card-box-${i}`);
          otherCard.style.transition = 'opacity 0.5s ease';
          otherCard.style.opacity = '0.2';
        }
      }

      loadingText.classList.remove('hidden');

      try {
        // 將使用者輸入的心事與選中的牌一起送到後端讓 Gemini 解析
        const response = await fetch('/api/reply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ thought, card: selectedCard })
        });

        const data = await response.json();

        // 填入處方箋
        document.getElementById('cardName').innerText = data.cardName || selectedCard.name;
        document.getElementById('cardEncouragement').innerText = `「 ${data.encouragement || "隨遇而安，順應自然。"} 」`;
        document.getElementById('cardInsight').innerText = data.insight || "放下多餘的擔憂。";
        document.getElementById('luckyAction').innerText = data.luckyAction || "喝一杯熱茶散步放空。";
        document.getElementById('avoidAction').innerText = data.avoidAction || "在深夜裡苛責自己。";
        document.getElementById('luckyOutfit').innerText = data.luckyOutfit || "米白色或溫暖色調。";

        // 讓使用者看清正面翻開的塔羅牌 1.6 秒，再滑順切換至處方箋卡片
        setTimeout(() => {
          const stepPick = document.getElementById('stepPick');
          const prescriptionCard = document.getElementById('prescriptionCard');

          stepPick.classList.remove('opacity-100');
          stepPick.classList.add('opacity-0');
          
          setTimeout(() => {
            stepPick.classList.add('hidden');
            loadingText.classList.add('hidden');
            cardsGrid.style.pointerEvents = 'auto';

            prescriptionCard.classList.remove('opacity-0', 'pointer-events-none');
            prescriptionCard.classList.add('opacity-100', 'pointer-events-auto', 'fade-in');
          }, 400);
        }, 1600);

      } catch (e) {
        console.error("解盤出錯:", e);
        loadingText.classList.add('hidden');
        cardsGrid.style.pointerEvents = 'auto';
      }
    }

    function shredAndFinish() {
      if (navigator.vibrate) navigator.vibrate([50, 70, 120]);
      playSingingBowl();

      const prescriptionCard = document.getElementById('prescriptionCard');
      const rect = prescriptionCard.getBoundingClientRect();
      const parentRect = canvas.getBoundingClientRect();
      createParticles(rect.left - parentRect.left + rect.width / 2, rect.top - parentRect.top + rect.height / 2);
      animateParticles();

      prescriptionCard.style.transform = 'scale(0.8) translateY(-20px)';
      prescriptionCard.style.opacity = '0';
      prescriptionCard.style.pointerEvents = 'none';

      setTimeout(() => {
        const peaceCard = document.getElementById('peaceCard');
        peaceCard.classList.remove('opacity-0', 'pointer-events-none');
        peaceCard.classList.add('opacity-100', 'pointer-events-auto');
      }, 600);
    }

    function resetView() {
      document.getElementById('thoughtInput').value = '';
      
      const peaceCard = document.getElementById('peaceCard');
      const prescriptionCard = document.getElementById('prescriptionCard');
      const stepPick = document.getElementById('stepPick');
      const stepInput = document.getElementById('stepInput');

      peaceCard.classList.remove('opacity-100', 'pointer-events-auto');
      peaceCard.classList.add('opacity-0', 'pointer-events-none');

      prescriptionCard.classList.remove('opacity-100', 'pointer-events-auto');
      prescriptionCard.classList.add('opacity-0', 'pointer-events-none');
      prescriptionCard.style.transform = 'scale(1) translateY(0)';

      stepPick.classList.add('hidden');
      stepPick.classList.remove('opacity-100');
      stepPick.classList.add('opacity-0');

      stepInput.classList.remove('hidden');
      requestAnimationFrame(() => {
        stepInput.style.transform = 'scale(1)';
        stepInput.style.opacity = '1';
      });
    }
  </script>
</body>
</html>
